# Checks every change to the maps. A failing check stops a bad change being
# merged; merged changes go live on their own (the site fetches this repository).
name: Check maps

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check the maps
        run: npm run check
